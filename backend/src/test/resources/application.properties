spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Tests build the schema from entities on H2; MySQL-dialect migrations are
# verified against a real MySQL instance at startup instead.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.admin.username=testadmin
app.admin.password=test-password-123
app.notify.enabled=false
app.notify.to=
spring.mail.host=
app.serviceability.prefixes=411,412
# Keep unit tests offline: the PIN directory lookup is exercised in PincodeDirectoryTests.
app.pincode.lookup-url=
