spring.application.name=dsp-website-api
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dsp_power_infra}
spring.datasource.username=${DB_USERNAME:dsp_dev}
spring.datasource.password=${DB_PASSWORD:local-dev-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:local-dev-admin}
app.serviceability.prefixes=${SERVICEABLE_PREFIXES:411,412}
app.notify.enabled=${NOTIFY_ENABLED:false}
app.notify.to=${NOTIFY_TO:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
